spring:
  datasource:
    url: jdbc:h2:mem:codepilotdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true

codepilot:
  encryption:
    key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  review:
    max-file-bytes: 102400
    max-diff-bytes: 2097152
gemini:
  api:
    key: "mock-key"
    url: "http://mock"
    model: "mock"
